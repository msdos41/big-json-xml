name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test BigJsonXml.slnx

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/BigJsonXml.Desktop/BigJsonXml.Desktop.csproj -c Release
          $exe = 'src/BigJsonXml.Desktop/bin/Release/net10.0/win-x64/publish/BigJsonXml.exe'
          if (-not (Test-Path $exe)) { throw "Publish did not produce $exe." }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: BigJsonXml-windows-amd64
          path: src/BigJsonXml.Desktop/bin/Release/net10.0/win-x64/publish/BigJsonXml.exe
          retention-days: 14
